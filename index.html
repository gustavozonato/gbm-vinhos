<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GBM Vinhos | Catálogo de vinhos</title>
  <meta name="description" content="Catálogo de vinhos da GBM Vinhos. Escolha o seu e peça pelo WhatsApp.">
  <meta name="theme-color" content="#23101A">
  <meta property="og:type" content="website">
  <meta property="og:title" content="GBM Vinhos | Catálogo de vinhos">
  <meta property="og:description" content="Escolha o seu vinho e peça pelo WhatsApp.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍷%3C/text%3E%3C/svg%3E">

  <!-- Fontes: Fraunces (títulos e preços) e Hanken Grotesk (textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- TOPO: nome da loja, frase, botões de contato e o vinho em destaque.
       Os textos vêm de dados/catalogo.json (preenchidos pelo js/app.js). -->
  <header class="topo">
    <div class="topo-conteudo">
      <div class="topo-texto">
        <h1 class="marca" id="loja-nome">GBM Vinhos</h1>
        <p class="frase" id="loja-frase"></p>
        <div class="topo-botoes" id="topo-botoes"></div>
      </div>
      <div id="destaque"></div>
    </div>
  </header>

  <!-- FILTROS: busca, tipos de vinho e ordenação -->
  <nav class="filtros" aria-label="Filtros do catálogo">
    <div class="filtros-conteudo">
      <label class="so-leitor" for="busca">Buscar vinhos</label>
      <input class="campo" id="busca" type="search" placeholder="Buscar por nome, uva ou país" autocomplete="off">

      <div class="tipos" id="tipos" role="group" aria-label="Filtrar por tipo"></div>

      <label class="so-leitor" for="ordem">Ordenar por</label>
      <select class="campo" id="ordem">
        <option value="destaques">Destaques</option>
        <option value="menor">Menor preço</option>
        <option value="maior">Maior preço</option>
        <option value="nome">Nome (A a Z)</option>
      </select>
    </div>
  </nav>

  <!-- CATÁLOGO: os cartões dos vinhos são criados pelo js/app.js -->
  <main class="catalogo">
    <p class="contagem" id="contagem" aria-live="polite"></p>
    <div class="grade" id="lista"></div>
    <p class="vazio" id="vazio" hidden></p>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <!-- JANELA DE DETALHES: abre ao clicar em um vinho (com o carrossel de fotos) -->
  <dialog class="detalhe" id="detalhe"></dialog>

  <script src="js/app.js"></script>
</body>
</html>
